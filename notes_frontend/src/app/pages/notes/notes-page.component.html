<app-header />

<main class="container main">
  <section class="sidebar">
    <app-notes-list
      [notes]="notes"
      [activeId]="selectedId()"
      (select)="onSelect($event)"
      (create)="onCreate()"
    />
  </section>

  <section class="content">
    <app-note-view
      [note]="activeNote"
      (edit)="onEdit()"
      (delete)="onRequestDelete()"
    />
  </section>
</main>

<app-note-editor
  [open]="editorOpen()"
  [model]="editorModel"
  (cancel)="editorOpen.set(false)"
  (save)="onSave($event)"
/>

<app-confirm-dialog
  [open]="confirmOpen()"
  title="Delete note?"
  message="This action cannot be undone."
  confirmText="Delete"
  cancelText="Cancel"
  (confirm)="onConfirmDelete()"
  (cancel)="onCancelDelete()"
/>
